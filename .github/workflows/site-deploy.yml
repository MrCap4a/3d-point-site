name: Printing site checks and image
on:
  push:
    branches: [master, codex/print3d-image-ci]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: print3d-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  check-build:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: print3d-site:${{ github.sha }}
          load: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://3-dpoint.ru' }}
            NEXT_PUBLIC_YM_ID=${{ vars.NEXT_PUBLIC_YM_ID }}
            NEXT_PUBLIC_YANDEX_VERIFICATION=${{ vars.NEXT_PUBLIC_YANDEX_VERIFICATION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Test image and persistence
        env:
          SITE_IMAGE: print3d-site:${{ github.sha }}
        run: bash deploy/smoke.sh
      - name: Save tested image
        if: github.event_name != 'pull_request'
        run: docker save print3d-site:${{ github.sha }} | gzip -1 > /tmp/image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: site-image
          path: /tmp/image.tar.gz
          retention-days: 2
  publish:
    timeout-minutes: 20
    needs: check-build
    # Off until the first image publication is explicitly enabled.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.PUBLISH_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-image
          path: /tmp/site-image
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}:$RELEASE_SHA"
          gzip -dc /tmp/site-image/image.tar.gz | docker load
          docker tag "print3d-site:$RELEASE_SHA" "$image"
          docker push "$image"
          printf 'Image for the infrastructure repository: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
