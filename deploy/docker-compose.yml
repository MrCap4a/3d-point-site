name: print3d
services:
  app:
    image: ${SITE_IMAGE:?Set tested image tag}
    restart: unless-stopped
    env_file:
      - path: ./runtime.env
        format: raw
    environment:
      DATABASE_URL: file:/app/data/dev.db
      UPLOADS_DIR: ./uploads
    volumes:
      - type: bind
        source: ./state/data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./state/uploads
        target: /app/uploads
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${SITE_PORT:-3100}:3000"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
